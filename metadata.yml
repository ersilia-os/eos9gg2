Title: Chemical space 2D projections against DrugBank
Description: Places a compound against DrugBank, returning four principal components
  alongside two-dimensional UMAP and t-SNE coordinates. Positioning is computed over
  Ersilia Compound Embeddings rather than fingerprints, so proximity reflects learned
  similarity rather than shared substructures. Using approved and investigational
  drugs as the reference makes this a way of asking how closely a query resembles
  chemistry that has already reached development, rather than screening chemistry.
